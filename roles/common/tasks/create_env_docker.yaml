- name: Make sure docker env is installed
  when: "'dietpi' not in group_names"
  block:
    - name: Install prereq packages
      ansible.builtin.package:
        name: "{{ docker_items }}"
        state: present
        update_cache: true
      loop_control:
        loop_var: docker_items
      loop:
        - docker
        - docker-compose

    - name: Enable and start docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

- name: Install python3 modules for dietpi hosts
  when: "'dietpi' in group_names"
  ansible.builtin.package:
    name: "{{ p3_mod_item }}"
    state: present
    update_cache: true
  loop:
    - python3-packaging
    - python3-requests
    - python3-pip
    - python3-docker
  loop_control:
    loop_var: p3_mod_item


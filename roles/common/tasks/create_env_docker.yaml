- name: Install additional packages
  ansible.builtin.apt:
    name: "{{ apt_items }}"
    state: present
  loop_control:
    loop_var: apt_items
  loop:
    - openssh-client
    - git
    - python3-systemd

- name: Create folder for {{ app_name }}
  ansible.builtin.file:
    path: /opt/{{ app_name }}
    state: directory
    mode: '0755'

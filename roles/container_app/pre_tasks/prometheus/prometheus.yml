- job_name: 'unifipoller'
  scrape_interval: 30s
  static_configs:
  - targets: [ 'unpoller.local.lan:9130' ]
- job_name: 'smartctl'
  scrape_interval: 60s
  static_configs:
  - targets:
    - homenas.ycdisp.net:9633
  relabel_configs:
  - source_labels: [ __address__ ]
    regex: '([^\.]+)\..+'
    target_label: instance
    replacement: $1
    action: replace
- job_name: 'cAdvisor'
  scrape_interval: 60s
  static_configs:
  - targets:
    # - podhost-dev.local.lan:8085
    # - podhost-dev.local.lan:8087
    - homenas.ycdisp.net:8085
    - homenas.ycdisp.net:8087
    - homenas.ycdisp.net:8088
    # - dietpi1.local.lan:8085
    # - dietpi2.local.lan:8085
  metric_relabel_configs:
  - action: labeldrop
    regex: container_label.*
  - source_labels: [ "id" ]
    regex: '.*/$'
    action: drop
  relabel_configs:
  - source_labels: [ __address__ ]
    regex: '([^:]+).+'
    target_label: instance
    replacement: $1
    action: replace

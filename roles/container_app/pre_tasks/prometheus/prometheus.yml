global:

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager.local.lan:9093

rule_files:
- "node-exporter.rules"
- "alertmanager.rules"
- "prometheus.rules"
- "blackbox.rules"
- "k3s.rules"

scrape_configs:
- job_name: 'integrations/node_exporter'
  scrape_interval: 60s
  static_configs:
  - targets: [ 'homeassistant.local.lan:9100' ]
    labels:
      env: 'prod'
- job_name: 'VMware'
  metrics_path: '/metrics'
  scrape_interval: 60s
  static_configs:
  - targets: [ 'vmware-exporter.local.lan:9272' ]
    labels:
      instance: 'vcsa-1'
      env: 'prod'
- job_name: 'Alertmanager'
  metrics_path: '/metrics'
  scrape_interval: 60s
  static_configs:
  - targets: [ 'alertmanager.local.lan:9093' ]
    labels:
      instance: 'alertmanager'
- job_name: 'UPS-Nut'
  metrics_path: /ups_metrics
  scrape_interval: 60s
  static_configs:
  - targets: [ 'dns2.ycdisp.net:9199' ]
    labels:
      instance: 'nut_monitor'
      env: 'prod'
- job_name: 'blackbox_http'
  metrics_path: /probe
  params:
    module: [ http_2xx ]
  static_configs:
  - targets:
    - https://www.diversionforum.net
    - https://www.ycdisp.com
    labels:
      env: 'prod'
  relabel_configs:
  - source_labels: [ __address__ ]
    target_label: __param_target
  - source_labels: [ __param_target ]
    target_label: instance
  - target_label: __address__
    replacement: blackbox-exporter.local.lan:9115
- job_name: 'blackbox_icmp'
  metrics_path: /probe
  params:
    module: [ icmp ]
  static_configs:
  - targets:
    - 192.168.1.1
    labels:
      instance: 'unifi_uxg_max'
      env: 'prod'
  - targets:
    - 192.168.1.3
    labels:
      instance: 'unifi_usw_24'
      env: 'prod'
  - targets:
    - 192.168.1.5
    labels:
      instance: 'tplink_upstairs_switch'
      env: 'prod'
  - targets:
    - 192.168.1.6
    labels:
      instance: 'unifi_ap_pro_mainfloor'
      env: 'prod'
  - targets:
    - 192.168.1.8
    labels:
      instance: 'nicgiga_switch'
      env: 'prod'
  - targets:
    - 192.168.1.9
    labels:
      instance: 'sodola_switch'
      env: 'prod'
  - targets:
    - 192.168.1.10
    labels:
      instance: 'unifi_ap_u6pro_mainfloor'
      env: 'prod'
  - targets:
    - 192.168.1.11
    labels:
      instance: 'unifi_ap_u6pro_upstairs'
      env: 'prod'
  - targets:
    - 192.168.1.12
    labels:
      instance: 'tplink_mainfloor_switch'
      env: 'prod'
  - targets:
    - 192.168.1.204
    labels:
      instance: 'esxinuc1'
      env: 'prod'
  - targets:
    - 192.168.1.205
    labels:
      instance: 'esxinuc2'
      env: 'prod'
  - targets:
    - 192.168.1.206
    labels:
      instance: 'esxinuc3'
      env: 'prod'
  relabel_configs:
  - source_labels: [ __address__ ]
    target_label: __param_target
  - source_labels: [ __param_target ]
    target_label: instance
  - target_label: __address__
    replacement: blackbox-exporter.local.lan:9115

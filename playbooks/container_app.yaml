---
# Usage: ansible-playbook container_app.yaml -e "hostvar=host app_name=app task=install user_account=user"

- name: Deploy container app
  hosts: "{{ hostvar | default([]) }}"
  become: false
  gather_facts: false
  # debugger: on_failed

  vars_files:
    - "vars/{{ app_name }}.yaml"

  tasks:

    - name: Assert user_account is defined if installing in podman env
      ansible.builtin.assert:
        that:
          - docker | default(false) | bool or (user_account | default('') in ['root', 'poduser', 'shareaccess'])
        fail_msg: |
          The variable 'user_account' must be defined if installing in podman environment.
          If this is a monitoring container (e.g., cadvisor), specify which user account to install under.
        success_msg: "The variable 'user_account' is properly defined."

    - name: Assert vars
      ansible.builtin.assert:
        that:
          - app_name is defined
          - task is defined
          - task in ['install', 'uninstall']
        fail_msg: |
          "The variables 'app_name', 'user_account', and 'task' must be defined."
          "The 'task' variable must be set to either 'install', or 'uninstall'."
        success_msg: "All required variables are properly defined."

    - name: Assert upgrade set correctly if used
      ansible.builtin.assert:
        that:
          - (upgrade is not defined) or (task == "install")
        fail_msg: "task must be set to 'install' if upgrading."

    - name: Manage container app for podman env - {{ app_name }}
      when: not docker
      ansible.builtin.include_role:
        name: eingram23.containers.container_app
        tasks_from: "{{ task }}"

    - name: Manage container app for docker  env - {{ app_name }}
      when: docker
      ansible.builtin.include_role:
        name: eingram23.containers.container_app
        tasks_from: "{{ task }}_docker"
        apply:
          become: true
          become_user: root
          become_method: ansible.builtin.sudo
